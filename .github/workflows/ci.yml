name: OS validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: ci_fixture_only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_ADMIN_URL: postgresql://postgres:ci_fixture_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run check:migrations
      - run: npm test
      - run: npm run test:isolated
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build --tag nexora-os:ci .
      - run: docker run --rm --entrypoint node nexora-os:ci --version
