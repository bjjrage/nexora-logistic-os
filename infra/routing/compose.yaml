services:
  osrm-preprocess:
    image: ghcr.io/project-osrm/osrm-backend@sha256:55dbfd47d984c2cacd64e32901b4321c86b5ec761438e69aa053dc78698a786f
    profiles: [setup]
    command: [sh, -c, "osrm-extract -p /opt/car.lua /data/paraguay-latest.osm.pbf && osrm-partition /data/paraguay-latest.osrm && osrm-customize /data/paraguay-latest.osrm"]
    volumes:
      - ./data:/data
  osrm:
    image: ghcr.io/project-osrm/osrm-backend@sha256:55dbfd47d984c2cacd64e32901b4321c86b5ec761438e69aa053dc78698a786f
    command: osrm-routed --algorithm mld --max-table-size 100 /data/paraguay-latest.osrm
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/data:ro
    restart: unless-stopped
  nominatim:
    image: mediagis/nominatim@sha256:168c30e20fbba0c2e8199fca7a8aa2640e8cc1a62f8b05b1958897796fdb38f1
    environment:
      PBF_URL: https://download.geofabrik.de/south-america/paraguay-latest.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?Define a private password for the map database}
      IMPORT_STYLE: address
      THREADS: "2"
      GUNICORN_WORKERS: "2"
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_MAINTENANCE_WORK_MEM: 512MB
      POSTGRES_AUTOVACUUM_WORK_MEM: 128MB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
    shm_size: 1gb
    restart: unless-stopped
volumes:
  nominatim-data:
